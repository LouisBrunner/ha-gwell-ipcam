# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
registries:
  hass-musl:
    type: python-index
    url: https://wheels.home-assistant.io/musllinux-index/
    replaces-base: false
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      docker-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"
      docker-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    cooldown:
      default-days: 7
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      docker-compose-security:
        applies-to: security-updates
        patterns:
          - "*"
      docker-compose-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"
      docker-compose-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "uv"
    cooldown:
      default-days: 7
    directory: "/"
    registries:
      - hass-musl
    schedule:
      interval: "weekly"
    ignore:
      # FIXME: we are tied to the targeted Home Assistant version (hacs.json), bump them together by hand
      - dependency-name: "aiohasupervisor"
      - dependency-name: "av"
      - dependency-name: "homeassistant"
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      uv-major:
        applies-to: version-updates
        update-types:
          - "major"
        patterns:
          - "*"
      uv-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
