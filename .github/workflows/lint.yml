# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: LouisBrunner/.github/.github/workflows/lint-all.yml@main
    permissions:
      actions: read
      contents: read
      statuses: write
      pull-requests: write

  vet:
    name: Vet
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/home-assistant/homeassistant-base:2026.05.0
      options: --user root
    steps:
      - name: Install dependencies
        run: apk add --no-cache git

      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      # FIXME: for some reason the hash changes everyday for the same version
      - name: Refresh multidict hashes
        run: uv lock --upgrade-package multidict

      - name: Vet
        run: just vet

  manifest-sync:
    name: Manifest sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up just
        uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"

      - name: Set up Biome
        uses: biomejs/setup-biome@v2.7.1
        with:
          version: 2.5.0

      - name: Check manifest sync
        run: |
          just manifest-sync
          if ! git diff --exit-code custom_components/gwell_ipcam/manifest.json; then
            echo "manifest.json is out of sync, run 'just manifest-sync' to fix"
            exit 1
          fi
