# $schema:https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  devcontainer:
    build: {}
    network_mode: host
    volumes:
      - ~/.docker_bash_history:/root/.ash_history
      - ~/.docker_bash_history:/home/app/.ash_history
      - .:/project
      - uv_cache:/home/app/.cache/uv

volumes:
  uv_cache:
